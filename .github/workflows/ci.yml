name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} (${{ matrix.deps }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        deps: [highest]
        include:
          - php: '8.2'
            deps: lowest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      - name: Install dependencies
        run: |
          if [ "${{ matrix.deps }}" = lowest ]; then
            composer update --no-interaction --no-progress --prefer-dist --prefer-lowest --prefer-stable
          else
            composer update --no-interaction --no-progress --prefer-dist
          fi

      - name: Boundaries (no framework or CMS in src)
        run: php bin/check-boundaries

      - name: Code style
        if: matrix.deps != 'lowest'
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Tests
        run: vendor/bin/phpunit

